name: Daily Idol Follower Scraper & Avatar Monitor

on:
  schedule:
    - cron: '10 7,19 * * *' # Every day at 02:10 and 14:10 Bangkok time (19:10 and 07:10 UTC)
    - cron: '0 13 * * *' # Every day at 20:00 Bangkok time (13:00 UTC) - missing-only run
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape_instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 playwright psycopg2-binary
        playwright install --with-deps chromium
    - name: Run Instagram Scraper
      env:
        POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      run: |
        HOUR=$(TZ="Asia/Bangkok" date +%H)
        if [ "$HOUR" -lt 12 ]; then
          ORDER_FLAG="--order asc"
          echo "Bangkok time hour $HOUR (AM) -> Order: ASCENDING"
        else
          ORDER_FLAG="--order desc"
          echo "Bangkok time hour $HOUR (PM) -> Order: DESCENDING"
        fi

        if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
          python3 follower_scraper.py --run --platform instagram --missing-only $ORDER_FLAG
        else
          python3 follower_scraper.py --run --platform instagram $ORDER_FLAG
        fi

  scrape_x:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 playwright psycopg2-binary
        playwright install --with-deps chromium
    - name: Run X Scraper
      env:
        POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      run: |
        HOUR=$(TZ="Asia/Bangkok" date +%H)
        if [ "$HOUR" -lt 12 ]; then
          ORDER_FLAG="--order asc"
          echo "Bangkok time hour $HOUR (AM) -> Order: ASCENDING"
        else
          ORDER_FLAG="--order desc"
          echo "Bangkok time hour $HOUR (PM) -> Order: DESCENDING"
        fi

        if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
          python3 follower_scraper.py --run --platform x --missing-only $ORDER_FLAG
        else
          python3 follower_scraper.py --run --platform x $ORDER_FLAG
        fi
    - name: Commit and Push idols config updates (if avatar URL changed)
      if: success() || failure()
      run: |
        git config --global user.name "Github Actions Scraper Bot"
        git config --global user.email "actions@github.com"
        git add idols.json || true
        git commit -m "Auto-update X avatars: $(date +'%Y-%m-%d')" || exit 0
        for i in {1..5}; do
          git pull --rebase && git push && break || sleep 5
        done

  scrape_facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install requests beautifulsoup4 psycopg2-binary
    - name: Run Facebook Scraper
      env:
        POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      run: |
        HOUR=$(TZ="Asia/Bangkok" date +%H)
        if [ "$HOUR" -lt 12 ]; then
          ORDER_FLAG="--order asc"
          echo "Bangkok time hour $HOUR (AM) -> Order: ASCENDING"
        else
          ORDER_FLAG="--order desc"
          echo "Bangkok time hour $HOUR (PM) -> Order: DESCENDING"
        fi

        if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
          python3 follower_scraper.py --run --platform facebook --missing-only $ORDER_FLAG
        else
          python3 follower_scraper.py --run --platform facebook $ORDER_FLAG
        fi

  scrape_tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 playwright psycopg2-binary
        playwright install --with-deps chromium
    - name: Run TikTok Scraper
      env:
        POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      run: |
        HOUR=$(TZ="Asia/Bangkok" date +%H)
        if [ "$HOUR" -lt 12 ]; then
          ORDER_FLAG="--order asc"
          echo "Bangkok time hour $HOUR (AM) -> Order: ASCENDING"
        else
          ORDER_FLAG="--order desc"
          echo "Bangkok time hour $HOUR (PM) -> Order: DESCENDING"
        fi

        if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
          python3 follower_scraper.py --run --platform tiktok --missing-only $ORDER_FLAG
        else
          python3 follower_scraper.py --run --platform tiktok $ORDER_FLAG
        fi

  scrape_missing_channels:
    needs: [scrape_instagram, scrape_x, scrape_facebook, scrape_tiktok]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 16
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 playwright psycopg2-binary
        playwright install --with-deps chromium
    - name: Run Missing Channels Scraper
      env:
        POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      run: |
        HOUR=$(TZ="Asia/Bangkok" date +%H)
        if [ "$HOUR" -lt 12 ]; then
          ORDER_FLAG="--order asc"
          echo "Bangkok time hour $HOUR (AM) -> Order: ASCENDING"
        else
          ORDER_FLAG="--order desc"
          echo "Bangkok time hour $HOUR (PM) -> Order: DESCENDING"
        fi

        python3 follower_scraper.py --run --missing-only $ORDER_FLAG

  lark_notification:
    needs: [scrape_instagram, scrape_x, scrape_facebook, scrape_tiktok, scrape_missing_channels]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install requests beautifulsoup4 psycopg2-binary
    - name: Run Final Alert
      env:
        POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      run: python3 follower_scraper.py --send-alert final
